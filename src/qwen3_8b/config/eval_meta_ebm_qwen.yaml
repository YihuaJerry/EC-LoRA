# Qwen3-8B LoRA Meta-EBM 单独评测配置。
# 通常训练脚本会在每个任务结束后自动评测；只有重评已有 EBM checkpoint 时才需要单独运行 eval_meta_ebm.py。

# 已训练好的 Meta-EBM checkpoint；必须改成实际的 *_final.pt 或 *_taskXX_*.ckpt.pt。
ebm_checkpoint: ""

# 要评测的任务；空字符串表示使用 EBM checkpoint 里保存的任务列表。
tasks: ""

# Qwen/CMA-ES LoRA checkpoint 根目录；目录下应包含 output_<task>_qwen3_8b/checkpoint-*。
checkpoint_root: "./checkpoints/qwen3_8b"

# Qwen checkpoint 目录后缀；实际目录名形如 output_cola_qwen3_8b。
checkpoint_output_suffix: "qwen3_8b"

# LoRA_Qwen 工程目录；评测会复用其中的数据处理和 GLUE metric。
lora_project_dir: "/path/to/LoRA_Qwen"

# LoRA_Qwen 的任务 YAML 配置目录。
lora_config_dir: "/path/to/LoRA_Qwen/config"

# 评测输出根目录。
output_dir: "./outputs/qwen3_8b/eval"

# 本次评测 run 名；空字符串表示用时间戳。
run_name: ""

# refinement 起点使用 top checkpoint 列表中的第几个 checkpoint；0 表示最优 checkpoint。
source_index: 0

# Meta-EBM refinement 使用的设备。
device: "cuda:0"

# refinement 能量下降步数。
refine_steps: 5

# refinement 每步学习率。
refine_lr: 0.0001

# refinement 能量缩放系数；>1 会让能量井更尖锐。
refine_beta: 1.0

# refinement 时对向量梯度逐元素裁剪；0 表示不裁剪。
refine_grad_clip: 0.0

# refinement Langevin 噪声强度；0 表示纯梯度下降。
langevin_std: 0.0

# 每个任务生成/评测多少个 refined adapter 样本。
num_samples: 1

# 多样本评测时，除 sample_00 外给初始向量添加的高斯噪声标准差。
init_noise_std: 0.0

# 是否把生成的 adapter 保存为 safetensors；false 时保存为 adapter_model.bin。
save_safetensors: false

# 是否只导出 refined adapter 而不加载 Qwen 模型跑 GLUE。
skip_eval: false

# GLUE 评测 split；validation 有标签，test 通常只适合生成预测。
eval_split: "validation"

# 数据来源；local 使用本地 GLUE 文件，official 从 HuggingFace 数据集加载，auto 自动回退。
dataset_source: "local"

# 评测时覆盖 base Qwen 模型路径；空值表示使用 LoRA_Qwen YAML 中的 pretrained_checkpoint。
model_path:

# 评测精度；auto 读取任务 YAML 中的 model.torch_dtype。
precision: "auto"

# GLUE 评测 per-device batch size。
per_device_batch_size: 8

# GLUE 评测 DataLoader worker 数。
dataloader_num_workers: 0

# 每个任务最多评测多少样本；空值表示使用完整 split。
max_samples:

# 可覆盖 CUDA_VISIBLE_DEVICES；空值表示不额外覆盖。
cuda_device:

# 是否强制 trust_remote_code=True；false 时沿用 LoRA_Qwen 任务 YAML。
trust_remote_code: false

# 任一任务失败时是否立刻中断；false 会记录失败并继续其它任务。
fail_fast: false
